name: Rangvia iOS + App Clip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Verifier Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Configurer Rangvia
        run: |
          mkdir -p ios/Config

          cat > ios/Config/Local.xcconfig <<'EOF'
          DEVELOPMENT_TEAM = 9642GYNCU9
          VT_BUNDLE_ID = app.rangvia.ios
          VT_CLIP_BUNDLE_ID = app.rangvia.ios.Clip
          VT_ASSOCIATED_DOMAIN = rangvia.com
          VT_API_BASE_URL = https://rangvia.com
          VT_APP_GROUP = group.app.rangvia
          VT_APNS_ENVIRONMENT = production
          EOF

      - name: Corriger definitivement le code Swift
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("ios")
          count = 0

          for p in root.rglob("*.swift"):
              original = p.read_text(encoding="utf-8")
              s = original

              # Xcode 16 : VT.Type entre en conflit avec Swift .Type
              s = s.replace("VT.Type.", "VT.Typography.")

              # Le fichier Design.swift contient la declaration du namespace
              if p.as_posix().endswith("VotreTourKit/Design.swift"):
                  s = s.replace(
                      "public enum Type {",
                      "public enum Typography {"
                  )

                  # Evite le conflit avec VotreTourKit.Configuration
                  s = s.replace(
                      "public func makeBody(configuration: Configuration) -> some View {",
                      "public func makeBody(configuration: ButtonStyleConfiguration) -> some View {"
                  )

              if s != original:
                  p.write_text(s, encoding="utf-8")
                  count += 1
                  print("PATCH:", p)

          print(f"{count} fichier(s) Swift corrige(s)")

          # VERIFICATIONS BLOQUANTES
          all_swift = "\n".join(
              p.read_text(encoding="utf-8")
              for p in root.rglob("*.swift")
          )

          design = Path(
              "ios/VotreTourKit/Design.swift"
          ).read_text(encoding="utf-8")

          if "VT.Type." in all_swift:
              raise SystemExit("ERREUR: VT.Type existe encore")

          if "public enum Type {" in design:
              raise SystemExit("ERREUR: enum Type existe encore")

          if "public enum Typography {" not in design:
              raise SystemExit("ERREUR: Typography absent")

          if "makeBody(configuration: Configuration)" in design:
              raise SystemExit("ERREUR: ancien ButtonStyle Configuration encore present")

          if "makeBody(configuration: ButtonStyleConfiguration)" not in design:
              raise SystemExit("ERREUR: ButtonStyleConfiguration absent")

          print("SWIFT PATCH = OK")
          PY

      - name: Corriger les entitlements
        run: |
          /usr/libexec/PlistBuddy \
            -c "Delete :keychain-access-groups" \
            ios/VotreTour/VotreTour.entitlements || true

          /usr/libexec/PlistBuddy \
            -c "Delete :keychain-access-groups" \
            ios/VotreTourClip/VotreTourClip.entitlements || true

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Rangvia" \
            ios/VotreTour/Info.plist

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleDisplayName Rangvia" \
            ios/VotreTourClip/Info.plist

      - name: Verification finale des correctifs
        run: |
          echo "=== TYPOGRAPHY ==="
          grep -n "enum Typography" ios/VotreTourKit/Design.swift

          echo "=== BUTTON STYLE ==="
          grep -n "makeBody" ios/VotreTourKit/Design.swift

          echo "=== RECHERCHE VT.Type ==="
          if grep -R "VT\.Type\." ios --include="*.swift"; then
            echo "ERREUR: VT.Type existe encore"
            exit 1
          else
            echo "OK: aucun VT.Type"
          fi

          echo "=== DIFF ==="
          git diff -- ios || true

      - name: Installer la cle App Store Connect
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8"

          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generer le projet Xcode
        working-directory: ios
        run: |
          rm -rf VotreTour.xcodeproj
          xcodegen generate

      - name: Verifier les Bundle ID
        working-directory: ios
        run: |
          xcodebuild \
            -project VotreTour.xcodeproj \
            -scheme VotreTour \
            -configuration Release \
            VT_BUNDLE_ID=app.rangvia.ios \
            VT_CLIP_BUNDLE_ID=app.rangvia.ios.Clip \
            VT_APP_GROUP=group.app.rangvia \
            VT_ASSOCIATED_DOMAIN=rangvia.com \
            VT_API_BASE_URL=https://rangvia.com \
            VT_APNS_ENVIRONMENT=production \
            -showBuildSettings \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|VT_BUNDLE_ID|VT_CLIP_BUNDLE_ID|VT_APP_GROUP|VT_APNS_ENVIRONMENT"

      - name: Archiver Rangvia + App Clip
        working-directory: ios
        run: |
          xcodebuild \
            -project VotreTour.xcodeproj \
            -scheme VotreTour \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Rangvia.xcarchive" \
            DEVELOPMENT_TEAM=9642GYNCU9 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.0.0 \
            VT_BUNDLE_ID=app.rangvia.ios \
            VT_CLIP_BUNDLE_ID=app.rangvia.ios.Clip \
            VT_APP_GROUP=group.app.rangvia \
            VT_ASSOCIATED_DOMAIN=rangvia.com \
            VT_API_BASE_URL=https://rangvia.com \
            VT_APNS_ENVIRONMENT=production \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            clean archive

      - name: Verifier archive
        run: |
          test -d "$RUNNER_TEMP/Rangvia.xcarchive"

          echo "ARCHIVE OK"

          /usr/libexec/PlistBuddy \
            -c "Print :ApplicationProperties:CFBundleIdentifier" \
            "$RUNNER_TEMP/Rangvia.xcarchive/Info.plist" || true

      - name: Creer ExportOptions
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store-connect</string>

            <key>destination</key>
            <string>upload</string>

            <key>signingStyle</key>
            <string>automatic</string>

            <key>teamID</key>
            <string>9642GYNCU9</string>

            <key>uploadSymbols</key>
            <true/>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

          </dict>
          </plist>
          EOF

      - name: Envoyer vers App Store Connect
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Rangvia.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"

          echo "RANGVIA ENVOYE A APP STORE CONNECT"
