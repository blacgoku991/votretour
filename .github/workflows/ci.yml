name: CI

on:
  push:
    branches: ['**']

# Le push valide chaque branche. Cela évite de doubler le même build avec
# un second run pull_request pour les branches de ce dépôt.
# Une rafale de commits ne garde que le plus récent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          # Valeurs factices : la build ne contacte aucun service.
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-ci
          SUPABASE_SERVICE_ROLE_KEY: service-de-ci
          NEXT_PUBLIC_SITE_URL: https://ci.votretour.test
          SESSION_HASH_SECRET: secret-de-ci-0123456789
      - name: Valider l'image Docker de production
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://ci.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=anon-de-ci \
            --build-arg NEXT_PUBLIC_SITE_URL=https://ci.rangvia.test \
            -t rangvia-web-ci .

  database:
    name: Base — migrations et suite de tests SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['54399:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Installer le client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Rejouer les migrations et la suite de tests
        run: ./scripts/verify-db.sh
        env:
          PGPORT: 54399
          PGHOST: 127.0.0.1
          PGUSER: postgres
