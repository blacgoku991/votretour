<!doctype html>
<!-- Posé sur l'écran du téléphone quand l'étape suivante sort du produit
     (fiche Google) : on dit ce qui se passe, on ne l'imite pas. -->
<html lang="fr" data-theme="dark" class="{{fontClass}}">
<head><meta charset="utf-8"><!--head--></head>
<body>
  <div class="k-frame" style="width: {{width}}px; height: {{height}}px">
    <div class="k-offscreen">
      <p class="k-kicker">{{kicker}}</p>
      <p class="k-offTitle">{{title}}</p>
      <p class="k-offBody">{{body}}</p>
      <div class="k-offRail"></div>
    </div>
  </div>
</body>
</html>
