<!doctype html>
<!-- Le texte RÉEL de la notification (notificationCopy), cité comme un
     texte : ni bannière d'iPhone ni d'Android imitée. Le banc ne peut pas
     recevoir de notification (Chromium sans affichage) : on le dit. -->
<html lang="fr" data-theme="dark" class="{{fontClass}}">
<head><meta charset="utf-8"><!--head--></head>
<body>
  <div class="k-frame k-bottom" style="width: {{width}}px; height: {{height}}px; padding: {{pad}}px">
    <div class="k-quote">
      <p class="k-kicker">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 8a5 5 0 0 1 10 0v3l1.4 2.2a.6.6 0 0 1-.5.9H4.1a.6.6 0 0 1-.5-.9L5 11V8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.2 16.6a2 2 0 0 0 3.6 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        {{kicker}}
      </p>
      <div class="k-quoteText">
        <p class="k-quoteTitle">{{title}}</p>
        <p class="k-quoteBody">{{body}}</p>
      </div>
      <p class="k-quoteNote">{{note}}</p>
    </div>
  </div>
</body>
</html>
