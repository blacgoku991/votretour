<!doctype html>
<!-- Carton d'ouverture : ce que l'on va voir, et que le commerce est fictif. -->
<html lang="fr" data-theme="dark" class="{{fontClass}}">
<head><meta charset="utf-8"><!--head--></head>
<body>
  <div class="k-frame k-opaque" style="width: {{width}}px; height: {{height}}px">
    <div class="k-full">
      <div>
        <p class="k-fullKicker"><i></i>{{kicker}}</p>
        <h1 class="k-fullTitle">{{title}}</h1>
        <p class="k-fullBody">{{body}}</p>
      </div>
      <div class="k-rang" aria-hidden="true">
        <p class="k-rangCounter">Comptoir</p>
        <div class="k-rangLine"></div>
        <div class="k-rangTrack">
          <div class="k-slat"></div>
          <div class="k-slat k-dim"></div>
          <div class="k-slat k-dimmer"></div>
          <div class="k-slat k-you"><b>{{client}}</b><small>{{clientHint}}</small></div>
        </div>
      </div>
    </div>
    <div class="k-brand"><!--wordmark--><b>Rang<span>via</span></b></div>
    <p class="k-fullFoot">{{foot}}</p>
  </div>
</body>
</html>
