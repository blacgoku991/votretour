<!doctype html>
<!-- Premier plan : la bague de chaque appareil, qui arrondit les angles de
     la capture, et la mention permanente « Commerce fictif ». Transparent
     partout ailleurs. -->
<html lang="fr" data-theme="dark" class="{{fontClass}}">
<head><meta charset="utf-8"><!--head--></head>
<body>
  <div class="k-frame" style="width: {{width}}px; height: {{height}}px">
    <div class="k-bezel" style="{{tabletBezel}}"></div>
    <div class="k-bezel" style="{{phoneBezel}}"></div>
    <div class="k-lens" style="{{tabletLens}}"></div>
    <p class="k-honest" style="{{honestPos}}"><i></i>Commerce fictif<span>· {{honestNote}}</span></p>
  </div>
</body>
</html>
