<!doctype html>
<!-- Légende d'un plan : numéro d'étape, titre, une phrase. -->
<html lang="fr" data-theme="dark" class="{{fontClass}}">
<head><meta charset="utf-8"><!--head--></head>
<body>
  <div class="k-frame" style="width: {{width}}px; height: {{height}}px">
    <div class="k-caption" style="{{captionStyle}}">
      <span class="k-step"><b>{{step}}</b><small>/ {{steps}}</small></span>
      <div>
        <p class="k-captionTitle">{{title}}</p>
        <p class="k-captionBody">{{body}}</p>
      </div>
    </div>
  </div>
</body>
</html>
